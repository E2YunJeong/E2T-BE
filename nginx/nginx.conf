user  nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  access_log    /var/log/nginx/access.log;
  error_log     /var/log/nginx/error.log;

  # 1) 80 포트는 모두 HTTPS로 리다이렉트
  server {
    listen 80;
    server_name api.noonsori.site;
    return 301 https://$host$request_uri;
  }

  # 2) 443 포트에서 API 서빙 (Daphne: app:8000)
  server {
    listen 443 ssl http2;
    server_name api.noonsori.site;

    # ---- certbot이 발급한 인증서 경로 (호스트에서 마운트됨)
    ssl_certificate     /etc/letsencrypt/live/api.noonsori.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.noonsori.site/privkey.pem;

    # 권장 TLS 세팅(간단 버전)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 업로드/타임아웃(필요 시 조정)
    client_max_body_size 20m;
    proxy_connect_timeout 60s;
    proxy_send_timeout  60s;
    proxy_read_timeout  600s;  # 웹소켓/스트리밍 길게

    # 기본 API 프록시
    location / {
      proxy_pass http://app:8000;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      # WebSocket 필수 헤더
      proxy_http_version 1.1;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";

      # 버퍼링 끔(실시간 이벤트시 유리)
      proxy_buffering off;
    }
  }
}
