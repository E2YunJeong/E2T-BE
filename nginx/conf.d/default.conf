`# 1) 80 포트: 모두 HTTPS로 리다이렉트
server {
  listen 80;
  server_name api.noonsori.site;

  return 301 https://$host$request_uri;
}

# 2) 443 포트: API(앱: app:8000) 프록시
server {
  listen 443 ssl http2;
  server_name api.noonsori.site;

  # ---- certbot이 발급한 인증서 경로 (호스트에서 /etc/letsencrypt 마운트 필요)
  ssl_certificate     /etc/letsencrypt/live/api.noonsori.site/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.noonsori.site/privkey.pem;

  # 권장 TLS 최소 설정(간단 버전)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  # 업로드/타임아웃(필요 시 조정)
  client_max_body_size 20m;
  proxy_connect_timeout 60s;
  proxy_send_timeout  60s;
  proxy_read_timeout  600s;  # 웹소켓/스트리밍 길게

  # 기본 API 프록시
  location / {
    # docker compose의 서비스 이름을 사용해야 DNS가 잡힘
    proxy_pass http://app:8000;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket 필수 헤더
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # 실시간 스트림에 유리
    proxy_buffering off;
  }
}
